[project]
name = "cinema-queue-bot"
version = "0.1.0"
description = "Telegram bot for selecting movies and managing shared TV"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Meanilin" },
]
dependencies = [
    # --- Core ---
    "aiogram>=3.13,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "psycopg2-binary>=2.9,<3",
    # --- Cache / FSM ---
    "redis>=5.2,<6",
    # RedisStorage встроен в aiogram 3.x: aiogram.fsm.storage.redis.RedisStorage
    # --- Settings / Logging ---
    "pydantic-settings>=2.7,<3",
    "pydantic>=2.9,<3",
    "structlog>=24.4,<25",
    "python-dotenv>=1.0,<2",
    # --- HTTP / utils ---
    "httpx>=0.27,<1",
    "tenacity>=9.0,<10",
    "orjson>=3.10,<4",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[project.scripts]
cinema-bot = "bot.__main__:main"
cinema-api = "api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "api", "core", "db", "models", "services", "agents"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "RET", "SIM", "TID", "ARG", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"tests/*" = ["B008", "PLR2004"]

# --- MyPy ---
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires running DB/Redis",
]
