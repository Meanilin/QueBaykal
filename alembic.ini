[alembic]
script_location = migrations
prepend_sys_path = .

# URL берётся из переменной окружения DATABASE_URL (см. migrations/env.py),
# здесь указано значение для запуска без env (например, в контейнере compose).
sqlalchemy.url = postgresql://cinema:cinema_secret@postgres:5432/cinema_queue

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
