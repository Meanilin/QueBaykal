[alembic]
script_location = migrations
prepend_sys_path = .

# Database URL is set by migrations/env.py at runtime from core.config.
# This default is used only for `alembic check` (offline mode).
sqlalchemy.url = postgresql+psycopg2://cinema:cinema_secret@postgres:5432/cinema_queue

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
